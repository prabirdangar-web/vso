<script>
/* ===== VSO save / sync layer =====
   Saves automatically: this browser (localStorage) + optional cloud (Firebase Firestore) so every computer sees the same data.
   To enable cloud: paste the SAME firebaseConfig used on your certificate site below. Leave null for browser-only + Export/Import. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCiqQFsnbSi6eCgUI_W3NTybzIkRmCI_54",
  authDomain: "tfhs-portal.firebaseapp.com",
  projectId: "tfhs-portal",
  storageBucket: "tfhs-portal.firebasestorage.app",
  messagingSenderId: "316041012204",
  appId: "1:316041012204:web:04ee8b19374c60f63716c9"
};            // e.g. {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}
const CLOUD_DOC = ["vso2026","layer1"];  // Firestore collection / document
const LS_KEY = "vso2026_layer1_v1";

const $s = id => document.getElementById(id);
const FR = {f1:$s("f1"), f2:$s("f2")};
let STATE = {ts:0, inputs:{}, views:{}};   // inputs: f1 fields by id; views: edited f2 sheets by view id
let ready = {f1:false, f2:false}, db = null, timer = null, applying = false;

function status(t){ $s("st").textContent = t; }

function collect(){
  const d1 = FR.f1.contentDocument, d2 = FR.f2.contentDocument;
  if(d1 && ready.f1){
    d1.querySelectorAll("input[id],textarea[id]").forEach(e=>{ STATE.inputs[e.id] = e.value; });
  }
  [[d1,"f1"],[d2,"f2"]].forEach(([d,k])=>{
    if(!d || !ready[k]) return;
    d.querySelectorAll(".view").forEach(v=>{
      if(!v._dirty) return;
      v.querySelectorAll("input").forEach(i=>i.setAttribute("value", i.value));
      v.querySelectorAll("textarea").forEach(t=>{ t.textContent = t.value; });
      STATE.views[v.id] = v.innerHTML;
    });
  });
  STATE.ts = Date.now();
  return STATE;
}

function apply(s){
  applying = true;
  const d1 = FR.f1.contentDocument, d2 = FR.f2.contentDocument, w1 = FR.f1.contentWindow;
  if(s.views){
    Object.keys(s.views).forEach(id=>{
      const v = (d1 && d1.getElementById(id)) || (d2 && d2.getElementById(id));
      if(!v || !v.classList.contains("view")) return;
      v.innerHTML = s.views[id];
      v._dirty = true;
      v.querySelectorAll(".sheet").forEach(x=>{x.contentEditable="true"; x.spellcheck=false});
    });
  }
  if(d1 && s.inputs){
    try{
      ["inv","rel","trn"].forEach(i=>{ const e=d1.getElementById(i); if(e && w1.calc) e.addEventListener("input", w1.calc); });
      ["f_app","f_used","f_unused"].forEach(i=>{ const e=d1.getElementById(i); if(e && w1.sync) e.addEventListener("input", w1.sync); });
    }catch(e){}
    const first = ["app"];
    const ids = first.concat(Object.keys(s.inputs).filter(k=>!first.includes(k)));
    ids.forEach(id=>{ const e=d1.getElementById(id); if(e && s.inputs[id]!==undefined) e.value = s.inputs[id]; });
    try{ w1.calc && w1.calc(); w1.sync && w1.sync(); }catch(e){}
  }
  STATE = {ts:s.ts||0, inputs:Object.assign({},s.inputs), views:Object.assign({},s.views)};
  applying = false;
}

function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){ status("⚠ browser storage full"); } }

async function saveCloud(){
  if(!db) return;
  try{ await db.collection(CLOUD_DOC[0]).doc(CLOUD_DOC[1]).set({json:JSON.stringify(STATE), ts:STATE.ts}); status("☁ Saved "+new Date().toLocaleTimeString()); }
  catch(e){ status("⚠ cloud save failed — saved on this browser"); console.error(e); }
}

function saveAll(){ collect(); saveLocal(); if(db) saveCloud(); else status("💾 Saved on this browser "+new Date().toLocaleTimeString()); }
function queue(){ if(applying) return; clearTimeout(timer); status("…typing"); timer = setTimeout(saveAll, 1200); }

function hook(){
  const d1 = FR.f1.contentDocument, d2 = FR.f2.contentDocument;
  d1.addEventListener("input", e=>{ const t=e.target; if(t && t.tagName!=="INPUT" && t.tagName!=="TEXTAREA"){ const v=t.closest && t.closest(".view"); if(v) v._dirty = true; } queue(); });
  d2.addEventListener("input", e=>{ const v=e.target.closest && e.target.closest(".view"); if(v) v._dirty = true; queue(); });
}

function loadJs(src){ return new Promise((ok,no)=>{ const a=document.createElement("script"); a.src=src; a.onload=ok; a.onerror=no; document.head.appendChild(a); }); }
let auth = null;

async function pullCloud(){
  try{
    const snap = await db.collection(CLOUD_DOC[0]).doc(CLOUD_DOC[1]).get();
    const cloud = snap.exists ? JSON.parse(snap.data().json) : null;
    collect();
    if(cloud && (cloud.ts||0) > (STATE.ts||0)){ apply(cloud); saveLocal(); status("☁ Loaded latest from cloud"); }
    else { await saveCloud(); }
  }catch(e){ console.error(e); status("⚠ cloud blocked — signed-in account not allowed? (saved on this browser)"); }
}

async function boot(){
  let local = null;
  try{ local = JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){}
  if(local) apply(local);
  hook();
  status("💾 Browser save on — sign in for cloud");
  if(!FIREBASE_CONFIG) return;
  try{
    const v="10.12.2", base="https://www.gstatic.com/firebasejs/"+v+"/";
    await loadJs(base+"firebase-app-compat.js");
    await Promise.all([loadJs(base+"firebase-auth-compat.js"), loadJs(base+"firebase-firestore-compat.js")]);
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth(); 
    auth.onAuthStateChanged(async u=>{
      if(u){
        db = firebase.firestore();
        $s("bSign").textContent = "🚪 Sign out ("+(u.email||"").split("@")[0]+")";
        status("☁ Signed in — syncing…");
        await pullCloud();
      }else{
        db = null;
        $s("bSign").textContent = "🔑 Sign in (Google)";
        status("💾 Browser save on — sign in for cloud");
      }
    });
  }catch(e){ console.error(e); status("⚠ cloud unavailable — using this browser"); }
}

$s("bSign").onclick = async ()=>{
  if(!auth){ status("⚠ cloud not ready yet"); return; }
  if(auth.currentUser){ await auth.signOut(); return; }
  try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ console.error(e); status("⚠ sign-in failed: "+(e.code||e.message)); }
};


/* ===== Word-style editing toolbar for Seating Plan / Letters (iframe f2) ===== */
function injectEditor(fr){
  const d=fr.contentDocument, w=fr.contentWindow;
  const bar=d.querySelector(".bar"); if(!bar||d.getElementById("fmt")) return;
  const st=d.createElement("style");
  st.textContent="#fmt{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#f3f6fb;padding:5px 6px;border-radius:6px;margin-top:2px}#fmt button,#fmt select{border:1px solid #9fb0d0;background:#fff;color:#0b2a5b;border-radius:4px;padding:4px 7px;font-weight:700;cursor:pointer;font-size:13px}#fmt button:hover{background:#dbe7ff}#fmt input[type=color]{padding:0;width:30px;height:26px;border:1px solid #9fb0d0;background:#fff}#fmt .sep{width:1px;height:22px;background:#9fb0d0;margin:0 3px}#fmt label{font-size:11px;color:#333}.sheet.let{border:0 !important;outline:0}@media print{#fmt{display:none}.sheet.let{border:0 !important;box-shadow:none}}";
  d.head.appendChild(st);
  try{ d.execCommand("defaultParagraphSeparator",false,"div"); }catch(e){}
  d.querySelectorAll(".view:not([id])").forEach((v,i)=>v.id="vtop"+(i||""));
  d.querySelectorAll(".sheet").forEach(x=>{x.contentEditable="true";x.spellcheck=false});
  const F=d.createElement("div"); F.id="fmt"; bar.appendChild(F);
  const touch=()=>{ const sel=w.getSelection(); let n=sel&&sel.anchorNode; n=n&&(n.nodeType===1?n:n.parentElement); const sh=n&&n.closest&&n.closest(".sheet"); if(sh) sh.dispatchEvent(new w.Event("input",{bubbles:true})); };
  const ex=(c,v)=>{ d.execCommand(c,false,v||null); touch(); };
  const blocks=()=>{ const s=w.getSelection(); if(!s.rangeCount) return []; const r=s.getRangeAt(0);
    let a=[...d.querySelectorAll(".sheet[contenteditable] p,.sheet[contenteditable] div,.sheet[contenteditable] li")].filter(e=>r.intersectsNode(e)&&!e.querySelector("p,div,li"));
    if(!a.length){ let n=s.anchorNode; n=n&&(n.nodeType===1?n:n.parentElement); const b=n&&n.closest&&n.closest("p,div,li"); if(b) a=[b]; } return a; };
  const btn=(t,title,fn)=>{ const b=d.createElement("button"); b.innerHTML=t; b.title=title; b.onmousedown=e=>e.preventDefault(); b.onclick=fn; F.appendChild(b); return b; };
  const sep=()=>{ const x=d.createElement("span"); x.className="sep"; F.appendChild(x); };
  const sel=(title,opts,fn)=>{ const x=d.createElement("select"); x.title=title; x.innerHTML="<option value=''>"+title+"</option>"+opts.map(o=>"<option value='"+o[0]+"'>"+o[1]+"</option>").join(""); x.onchange=()=>{ if(x.value!==""){ fn(x.value); } x.selectedIndex=0; }; F.appendChild(x); return x; };

  btn("↶","Undo (Ctrl+Z)",()=>ex("undo")); btn("↷","Redo (Ctrl+Y)",()=>ex("redo")); sep();
  sel("Font",[["Segoe UI","Segoe UI"],["Arial","Arial"],["Times New Roman","Times New Roman"],["Calibri","Calibri"],["Cambria","Cambria"],["Verdana","Verdana"],["Courier New","Courier New"],["Nirmala UI","Bengali (Nirmala UI)"],["Vrinda","Bengali (Vrinda)"]],v=>ex("fontName",v));
  sel("Size",[8,9,10,11,12,14,16,18,20,24,28,32,36,48,72].map(n=>[n,n+" pt"]),v=>{ d.execCommand("fontSize",false,"7"); d.querySelectorAll('font[size="7"]').forEach(f=>{ const sp=d.createElement("span"); sp.style.fontSize=v+"pt"; sp.innerHTML=f.innerHTML; f.replaceWith(sp); }); touch(); }); sep();
  btn("<b>B</b>","Bold (Ctrl+B)",()=>ex("bold")); btn("<i>I</i>","Italic (Ctrl+I)",()=>ex("italic")); btn("<u>U</u>","Underline (Ctrl+U)",()=>ex("underline")); btn("<s>S</s>","Strikethrough",()=>ex("strikeThrough"));
  btn("x<sub>2</sub>","Subscript",()=>ex("subscript")); btn("x<sup>2</sup>","Superscript",()=>ex("superscript")); sep();
  const lc=d.createElement("label"); lc.innerHTML="A "; const ci=d.createElement("input"); ci.type="color"; ci.value="#000000"; ci.title="Text colour"; ci.onmousedown=()=>{}; ci.oninput=()=>ex("foreColor",ci.value); lc.appendChild(ci); F.appendChild(lc);
  const lh=d.createElement("label"); lh.innerHTML="▮ "; const hi=d.createElement("input"); hi.type="color"; hi.value="#ffff00"; hi.title="Highlight"; hi.oninput=()=>ex("hiliteColor",hi.value); lh.appendChild(hi); F.appendChild(lh); sep();
  btn("⇤","Align left",()=>ex("justifyLeft")); btn("⇔","Centre",()=>ex("justifyCenter")); btn("⇥","Align right",()=>ex("justifyRight")); btn("☰","Justify",()=>ex("justifyFull")); sep();
  btn("• List","Bullets",()=>ex("insertUnorderedList")); btn("1. List","Numbering",()=>ex("insertOrderedList")); btn("→|","Increase indent",()=>ex("indent")); btn("|←","Decrease indent",()=>ex("outdent")); sep();
  sel("Line spacing",[["1","1.0"],["1.15","1.15"],["1.3","1.3"],["1.5","1.5"],["2","2.0"]],v=>{ blocks().forEach(b=>b.style.lineHeight=v); touch(); });
  sel("Para spacing",[["0","Tight (0)"],["4","Small (4 pt)"],["8","Normal (8 pt)"],["14","Wide (14 pt)"]],v=>{ blocks().forEach(b=>{ b.style.marginTop="0"; b.style.marginBottom=v+"pt"; }); touch(); });
  btn("Tight ¶","Remove extra gaps between lines/paragraphs in the selection",()=>{ blocks().forEach(b=>{ b.style.margin="0"; b.style.lineHeight="1.35"; }); touch(); }); sep();
  btn("Tx","Clear formatting",()=>ex("removeFormat")); btn("⎯","Insert horizontal line",()=>ex("insertHorizontalRule")); btn("🖨","Print",()=>w.print());
  d.addEventListener("keydown",e=>{ if(e.key==="Tab"){ const n=e.target; if(n&&n.closest&&n.closest(".sheet[contenteditable]")){ e.preventDefault(); d.execCommand("insertHTML",false,"&emsp;&emsp;"); } } });
}


/* ===== Packet labels: make the entered figures large and clear ===== */
function injectLabels(){
  const d=FR.f1.contentDocument; if(!d||d.getElementById("lblx")) return;
  const st=d.createElement("style"); st.id="lblx";
  st.textContent=".lab .bd{font-size:15px;gap:6px 18px}.lab .bd .big{font-size:27px;letter-spacing:.5px}.lab .bd .big span{font-size:46px;font-weight:900;color:#b91c1c;border-bottom:3px solid #b91c1c;padding:0 10px;margin-left:6px}.lab .bd .val{font-size:30px;font-weight:900;color:#1d4ed8;margin-left:6px}.lab .bd .b_app,.lab .bd .b_used,.lab .bd .b_unused{font-size:34px;font-weight:900;color:#b91c1c}.lab .bd div b{font-size:15px}.lab .bd .w.big b{font-size:inherit}";
  d.head.appendChild(st);
  d.querySelectorAll(".lab .bd > div:not(.w)").forEach(x=>{
    const b=x.querySelector("b"); if(!b||!/allotted|received|appeared/i.test(b.textContent)) return;
    [...x.childNodes].forEach(n=>{ if(n.nodeType===3 && n.textContent.trim()){ const sp=d.createElement("span"); sp.className="val"; sp.textContent=n.textContent.trim(); x.replaceChild(sp,n); } });
  });
}

Object.values(FR).forEach(f=>f.addEventListener("load",()=>{
  ready[f.id] = true; if(f.id==="f1"){ try{ injectLabels(); }catch(e){ console.error(e); } } try{ injectEditor(f); }catch(e){ console.error(e); }
  if(ready.f1 && ready.f2) boot();
}));

$s("bSave").onclick = saveAll;
$s("bExp").onclick = ()=>{ collect(); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(STATE)],{type:"application/json"})); a.download="VSO2026_layer1_data.json"; a.click(); };
$s("bImp").onclick = ()=>$s("fImp").click();
$s("fImp").onchange = e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ apply(JSON.parse(r.result)); STATE.ts=Date.now(); saveLocal(); if(db) saveCloud(); status("✔ Imported"); }catch(x){ status("⚠ invalid file"); } }; r.readAsText(f); };
window.addEventListener("beforeunload", ()=>{ if(ready.f1&&ready.f2){ collect(); saveLocal(); } });
</script>
